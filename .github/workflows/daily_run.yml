name: Daily Market Reports

on:
  schedule:
    - cron: '17 5 * * *' # 08:17 TR time (UTC 05:17)
  workflow_dispatch:

jobs:
  market-analysis:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy matplotlib requests

      - name: Run Initial Message
        run: python initial_message.py

      - name: Run S&P 500 Analysis
        run: python sp500_bot.py

      - name: Run Gold Analysis
        run: python gold_bot.py

      - name: Run Bitcoin Analysis
        run: python bitcoin_bot.py

      - name: Run BIST 100 Analysis
        run: python bist_bot.py

      - name: Run Multi Asset Rotation Analysis
        run: python multi_asset_rotation_bot.py